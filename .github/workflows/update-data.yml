name: Update rates

on:
  schedule:
    # Weekdays, at off-peak minutes (GitHub delays or skips runs at :00/:30 when busy).
    # Times are UTC; each one lands after the release in both daylight and standard time.
    - cron: "17 13 * * 1-5"   # after SOFR posts (~8am ET)
    - cron: "41 15 * * 1-5"   # backup for the morning run
    - cron: "53 20 * * 1-5"   # after Treasury posts (~3:30pm ET)
    - cron: "23 23 * * 1-5"   # backup for the afternoon run
  workflow_dispatch:

permissions:
  contents: write

# never let two runs commit at the same time
concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet && exit 0
          git commit -m "Update rates $(date -u +%F)"
          git pull --rebase origin main
          git push
