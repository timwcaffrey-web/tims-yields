name: Update rates

on:
  schedule:
    # Weekdays: after SOFR posts (~8am ET) and after Treasury posts (~3:30pm ET)
    - cron: "30 13 * * 1-5"
    - cron: "45 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "Update rates $(date -u +%F)"
          git push
